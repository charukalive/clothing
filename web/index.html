    // Fallback Variant Resolver for Legacy/Incomplete Products
    function resolveVariants(product) {
      let sizes = Array.isArray(product.sizes) && product.sizes.length > 0 ? product.sizes : [];
      let colours = Array.isArray(product.colours) && product.colours.length > 0 ? product.colours : [];

      if (sizes.length === 0) {
        const title = product.name || '';
        const sizeMatch = title.match(/\b(XS|S|M|L|XL|XXL|Free Size|\d{2})\b/i);
        if (sizeMatch) {
          sizes = [sizeMatch[1].toUpperCase()];
        } else {
          sizes = ['S', 'M', 'L', 'XL'];
        }
      }

      if (colours.length === 0) {
        colours = [
          { name: 'White Sand', hex: '#F8F9FA' },
          { name: 'Charcoal Black', hex: '#18181B' }
        ];
      }

      return { sizes, colours };
    }

    // Unified Data & Storage Service (Dual Projection Architecture with Instant Local Fallback)
    const DataService = {
      init() {
        const existing = localStorage.getItem('mandara_products') || localStorage.getItem('araliya_products');
        if (!existing) {
          localStorage.setItem('mandara_products', JSON.stringify(DEFAULT_PRODUCTS));
          const publicCatalog = DEFAULT_PRODUCTS.map(p => {
            const { cost, ...pub } = p;
            return pub;
          });
          localStorage.setItem('mandara_public_products', JSON.stringify(publicCatalog));
        } else if (!localStorage.getItem('mandara_products')) {
          localStorage.setItem('mandara_products', existing);
        }
      },
      getPublicProducts() {
        try {
          const raw = localStorage.getItem('mandara_public_products') || localStorage.getItem('mandara_products') || localStorage.getItem('araliya_public_products');
          const list = raw ? JSON.parse(raw) : DEFAULT_PRODUCTS;
          return list.filter(p => p.published && !p.archived);
        } catch (e) {
          console.error('Failed to read products', e);
          return DEFAULT_PRODUCTS;
        }
      },
      getOrders() {
        try {
          const raw = localStorage.getItem('mandara_orders') || localStorage.getItem('araliya_orders');
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      },
      createOrder(orderData) {
        const orders = this.getOrders();
        orders.unshift(orderData);
        localStorage.setItem('mandara_orders', JSON.stringify(orders));
        window.dispatchEvent(new Event('storage'));
        return orderData;
      },
      findOrder(orderId, token) {
        const orders = this.getOrders();
        return orders.find(o => 
          o.orderId.toUpperCase() === (orderId || '').trim().toUpperCase() && 
          o.accessToken === (token || '').trim()
        );
      }
    };

      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [checkoutForm, setCheckoutForm] = useState({
        name: '',
        phone: '',
        email: '',
        address: '',
        city: 'Colombo',
        notes: '',
        paymentMethod: 'COD'
      });
      const [orderSuccessData, setOrderSuccessData] = useState(null);

      // Tracking State
      const [trackInputId, setTrackInputId] = useState('');
      const [trackInputToken, setTrackInputToken] = useState('');
      const [trackedOrder, setTrackedOrder] = useState(null);
      const [trackError, setTrackError] = useState('');

      // Force tab title dynamically to bypass any browser title cache
      useEffect(() => {
        document.title = 'Mandara Fashion • Ceylon Living & Apparel';
      }, []);

      // Save language & cart to storage
      useEffect(() => {
        localStorage.setItem('mandara_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('mandara_cart', JSON.stringify(cart));
      }, [cart]);

      // Cross-window update listener
      useEffect(() => {
        const handleSync = () => {
          setProducts(DataService.getPublicProducts());
        };
        window.addEventListener('storage', handleSync);
        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'PRODUCT_SAVED') {
            handleSync();
          }
        });
        return () => {
          window.removeEventListener('storage', handleSync);
        };
      }, []);

      // Extract unique categories
      const categories = useMemo(() => {
        const set = new Set(['All']);
        products.forEach(p => {
          if (p.category) set.add(p.category);
        });
        return Array.from(set);
      }, [products]);

      // Filtered products list
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCat = activeCategory === 'All' || p.category === activeCategory;
          const matchSearch = !searchQuery || 
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (p.description && p.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (p.category && p.category.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchCat && matchSearch;
        });
      }, [products, activeCategory, searchQuery]);

      // Cart calculations
      const cartCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      const cartSubtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      }, [cart]);

      const deliveryFee = useMemo(() => {
        if (cartSubtotal >= 10000 || cartSubtotal === 0) return 0;
        return BRAND.deliveryFeeIslandwide;
      }, [cartSubtotal]);

      const cartTotal = cartSubtotal + deliveryFee;

      // Handle card selections
      const getSelection = (productId) => {
        return cardSelections[productId] || {};
      };

      const setCardColor = (productId, colour) => {
        setCardSelections(prev => ({
          ...prev,
          [productId]: { ...prev[productId], colour }
        }));
      };

      const setCardSize = (productId, size) => {
        setCardSelections(prev => ({
          ...prev,
          [productId]: { ...prev[productId], size }
        }));
      };

      // Open Variant Modal when either size or color is missing
      const triggerProductAction = (product, actionType) => {
        const { sizes, colours } = resolveVariants(product);
        const sel = getSelection(product.id);

        const hasSize = sel.size || (sizes.length === 1 && sizes[0]);
        const hasColor = sel.colour || (colours.length === 1 && colours[0]);

        if (!hasSize || !hasColor) {
          setVariantTargetProduct(product);
          setVariantTargetAction(actionType);
          setModalSelectedSize(sel.size || (sizes.length === 1 ? sizes[0] : ''));
          setModalSelectedColor(sel.colour || (colours.length === 1 ? colours[0] : null));
          setIsVariantModalOpen(true);
        } else {
          executeAction(product, actionType, sel.size || sizes[0], sel.colour || colours[0]);
        }
      };

      const executeAction = (product, actionType, size, colour) => {
        if (actionType === 'cart') {
          addToCart(product, size, colour);
          setIsCartOpen(true);
        } else if (actionType === 'whatsapp') {
          const text = encodeURIComponent(
            `*New Order Inquiry • ${BRAND.name}*\n` +
            `━━━━━━━━━━━━━━━━━━━━━━\n` +
            `• *Item:* ${product.name}\n` +
            `• *Size:* ${size}\n` +
            `• *Colour:* ${colour.name}\n` +
            `• *Price:* ${formatLKR(product.price)}\n` +
            `• *Qty:* 1\n` +
            `━━━━━━━━━━━━━━━━━━━━━━\n` +
            `*Total:* ${formatLKR(product.price)}\n\n` +
            `Ayubowan! Please confirm stock availability and islandwide delivery time to my address.`
          );
          window.open(`https://wa.me/${BRAND.whatsappNumber}?text=${text}`, '_blank');
        }
      };

      const confirmVariantModal = () => {
        if (!variantTargetProduct) return;
        const { sizes, colours } = resolveVariants(variantTargetProduct);
        const finalSize = modalSelectedSize || sizes[0];
        const finalColor = modalSelectedColor || colours[0];

        setCardSelections(prev => ({
          ...prev,
          [variantTargetProduct.id]: { size: finalSize, colour: finalColor }
        }));

        setIsVariantModalOpen(false);
        executeAction(variantTargetProduct, variantTargetAction, finalSize, finalColor);
      };

      // Cart management
      const addToCart = (product, size, colour) => {
        setCart(prev => {
          const existingIndex = prev.findIndex(item => 
            item.id === product.id && item.size === size && item.colour.name === colour.name
          );
          if (existingIndex > -1) {
            const next = [...prev];
            next[existingIndex].quantity += 1;
            return next;
          }
          return [...prev, {
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            size,
            colour,
            quantity: 1
          }];
        });
      };

      const updateCartQty = (index, delta) => {
        setCart(prev => {
          const next = [...prev];
          const newQty = next[index].quantity + delta;
          if (newQty <= 0) {
            next.splice(index, 1);
          } else {
            next[index].quantity = newQty;
          }
          return next;
        });
      };

      // 1-Click WhatsApp Direct Checkout from Cart
      const triggerWhatsAppCartCheckout = () => {
        if (cart.length === 0) return;
        let itemsList = '';
        cart.forEach((item, i) => {
          itemsList += `${i + 1}. *${item.name}*\n   Size: ${item.size} | Colour: ${item.colour.name}\n   Qty: ${item.quantity} × ${formatLKR(item.price)} = ${formatLKR(item.price * item.quantity)}\n`;
        });

        const msg = encodeURIComponent(
          `*Direct Order Request • ${BRAND.name}*\n` +
          `━━━━━━━━━━━━━━━━━━━━━━\n` +
          `${itemsList}` +
          `━━━━━━━━━━━━━━━━━━━━━━\n` +
          `• *Subtotal:* ${formatLKR(cartSubtotal)}\n` +
          `• *Delivery:* ${deliveryFee === 0 ? 'FREE (Special Offer)' : formatLKR(deliveryFee)}\n` +
          `• *Grand Total:* ${formatLKR(cartTotal)}\n\n` +
          `Ayubowan! I would like to confirm this order. Here are my delivery details:\n` +
          `Name: \n` +
          `Phone: \n` +
          `Delivery Address: \n` +
          `City / Postal Code: `
        );
        window.open(`https://wa.me/${BRAND.whatsappNumber}?text=${msg}`, '_blank');
      };

      // Online Cash on Delivery / Bank Transfer Form Submission
      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        const timestamp = Date.now();
        const randId = Math.floor(1000 + Math.random() * 9000);
        const orderId = `ORD-${timestamp.toString().slice(-4)}${randId}`;
        const accessToken = 'AT-' + Math.random().toString(36).substring(2, 10).toUpperCase();

        const newOrder = {
          orderId,
          accessToken,
          idempotencyKey: `IDEM-${timestamp}-${Math.random().toString(36).substring(2, 7)}`,
          customer: {
            name: checkoutForm.name,
            phone: checkoutForm.phone,
            email: checkoutForm.email,
            address: checkoutForm.address,
            city: checkoutForm.city,
            notes: checkoutForm.notes
          },
          items: cart,
          subtotal: cartSubtotal,
          deliveryFee,
          total: cartTotal,
          paymentMethod: checkoutForm.paymentMethod,
          status: 'pending',
          courier: 'Pronto Logistics Sri Lanka',
          trackingNumber: `PRN-LK-${randId}`,
          createdAt: new Date().toISOString()
        };

        DataService.createOrder(newOrder);

        setCart([]);
        setIsCartOpen(false);
        setIsCheckoutOpen(false);
        setOrderSuccessData(newOrder);
      };

      // Tracking lookup
      const handleTrackLookup = (e) => {
        e.preventDefault();
        setTrackError('');
        const found = DataService.findOrder(trackInputId, trackInputToken);
        if (found) {
          setTrackedOrder(found);
        } else {
          setTrackedOrder(null);
          setTrackError('Order not found. Please verify your Order ID (ORD-XXXX) and private Access Token.');
        }
      };

      const trackingSteps = [
        { key: 'pending', label: 'Order Placed', desc: 'Received at Colombo Atelier' },
        { key: 'confirmed', label: 'Confirmed', desc: 'Verified & Tailoring Assigned' },
        { key: 'packing', label: 'Packing', desc: 'Quality Check & Eco-Packaging' },
        { key: 'dispatched', label: 'Dispatched', desc: 'Handed to Islandwide Courier' },
        { key: 'delivered', label: 'Delivered', desc: 'Safely Arrived at Customer' }
      ];

      const getStepIndex = (status) => {
        switch (status) {
          case 'pending': return 0;
          case 'confirmed': return 1;
          case 'packing': return 2;
          case 'dispatched': return 3;
          case 'delivered': return 4;
          default: return 0;
        }
      };

      return (
        <div class="flex-grow flex flex-col">
          {/* Top Banner */}
          <div class="bg-stone-900 text-stone-200 text-xs py-2 px-4 text-center font-medium tracking-wide flex items-center justify-center gap-2">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            <span>{t.announcement}</span>
          </div>

          {/* Navigation Bar */}
          <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-stone-200/80 transition-all">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              {/* Brand Logo */}
              <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center group">
                  <img src="assets/logo.svg" alt="Mandara Fashion" class="h-12 w-auto transition-transform group-hover:scale-[1.02]"/>
                </a>
              </div>

              {/* Center Search Input */}
              <div class="hidden md:flex flex-1 max-w-md mx-6 relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" stroke-width="2"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2"></line>
                  </svg>
                </div>
                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full pl-10 pr-10 py-2.5 rounded-full bg-stone-100/80 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-800/20 focus:border-amber-700 transition"
                />
                {searchQuery && (
                  <button 
                    onClick={() => setSearchQuery('')}
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-stone-400 hover:text-stone-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <line x1="18" y1="6" x2="6" y2="18" stroke-width="2"></line>
                      <line x1="6" y1="6" x2="18" y2="18" stroke-width="2"></line>
                    </svg>
                  </button>
                )}
              </div>

              {/* Right Utilities */}
              <div class="flex items-center gap-2 sm:gap-3">
                
                {/* Language Switcher */}
                <div class="relative inline-block text-left">
                  <select 
                    value={lang} 
                    onChange={(e) => setLang(e.target.value)}
                    class="bg-stone-50 border border-stone-200 text-stone-700 text-xs font-semibold rounded-full px-3 py-2 cursor-pointer focus:outline-none min-touch">
                    <option value="en">English (EN)</option>
                    <option value="si">සිංහල (SI)</option>
                    <option value="ta">தமிழ் (TA)</option>
                  </select>
                </div>

                {/* Live Order Tracking Button */}
                <button
                  onClick={() => { setIsTrackingOpen(true); setTrackError(''); }}
                  class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-stone-300 text-stone-700 hover:bg-stone-50 text-xs font-semibold tracking-wide transition min-touch">
                  <svg class="w-4 h-4 text-amber-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>{t.trackOrder}</span>
                </button>

                {/* Admin Portal Shortcut Link */}
                <a
                  href="admin.html"
                  title="Admin Portal"
                  class="p-2.5 rounded-full text-stone-500 hover:text-stone-900 hover:bg-stone-100 transition min-touch flex items-center justify-center">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                  </svg>
                </a>

                {/* Cart Button */}
                <button
                  onClick={() => setIsCartOpen(true)}
                  class="relative inline-flex items-center gap-2 bg-stone-900 hover:bg-black text-white px-4 py-2.5 rounded-full text-xs font-semibold tracking-wider uppercase transition shadow-sm min-touch">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                  </svg>
                  <span class="hidden sm:inline">{t.cart}</span>
                  {cartCount > 0 && (
                    <span class="bg-amber-600 text-white text-[11px] font-bold px-1.5 py-0.5 rounded-full">
                      {cartCount}
                    </span>
                  )}
                </button>

              </div>
            </div>

            {/* Mobile Search Bar */}
            <div class="md:hidden px-4 pb-3">
              <div class="relative">
                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full pl-9 pr-8 py-2 rounded-full bg-stone-100 border border-stone-200 text-xs focus:outline-none"
                />
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" stroke-width="2"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2"></line>
                  </svg>
                </div>
              </div>
            </div>
          </header>

          {/* Hero Section */}
          <section class="relative bg-[#f5efe6] border-b border-stone-200/80 overflow-hidden py-12 md:py-20 px-4 sm:px-6">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-10">
              <div class="max-w-xl space-y-5 text-center md:text-left">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100/80 text-amber-900 text-xs font-semibold tracking-widest uppercase">
                  <span>Made in Sri Lanka</span>
                  <span>•</span>
                  <span>100% Pure Linen &amp; Handlooms</span>
                </div>
                <h1 class="font-serif text-3xl sm:text-5xl lg:text-6xl text-stone-900 font-semibold tracking-tight leading-tight">
                  Island Living, <br />
                  <span class="italic font-normal text-amber-800">Tailored Elegance</span>
                </h1>
                <p class="text-stone-600 text-sm sm:text-base leading-relaxed">
                  Bespoke resort silhouettes and relaxed linen apparel designed for tropical breezes and sophisticated evenings. Handcrafted with Ceylon pride.
                </p>
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                  <a href="#catalogue" class="inline-flex items-center px-6 py-3 rounded-full bg-stone-900 hover:bg-black text-white text-xs font-semibold tracking-widest uppercase transition min-touch">
                    Explore Catalogue
                  </a>
                  <button 
                    onClick={() => { setIsTrackingOpen(true); }}
                    class="sm:hidden inline-flex items-center px-5 py-3 rounded-full border border-stone-400 text-stone-800 text-xs font-semibold tracking-wider transition min-touch">
                    Track Existing Order
                  </button>
                </div>
              </div>

              {/* Hero Image Collage */}
              <div class="relative w-full max-w-sm sm:max-w-md">
                <div class="aspect-[4/5] rounded-2xl overflow-hidden shadow-xl border-4 border-white bg-stone-200">
                  <img 
                    src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=800&q=80" 
                    alt="Ceylon Linen Craftsmanship"
                    class="w-full h-full object-cover"
                  />
                </div>
                <div class="absolute -bottom-4 -left-4 bg-white/95 backdrop-blur-md p-4 rounded-xl shadow-lg border border-stone-200/80 max-w-[200px]">
                  <p class="text-[11px] font-serif font-bold text-stone-900 uppercase tracking-wider">Mandara Fashion</p>
                  <p class="text-[10px] text-stone-500 mt-0.5">Signature 180 GSM Pure Organic Linen</p>
                </div>
              </div>
            </div>
          </section>

          {/* Catalogue & Filters Section */}
          <main id="catalogue" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
            
            {/* Category Pills Header */}
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
              <div>
                <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-stone-900">Apparel Catalogue</h2>
                <p class="text-xs text-stone-500 mt-1">Showing {filteredProducts.length} handcrafted apparel designs</p>
              </div>

              {/* Category Filter Chips */}
              <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    class={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition min-touch flex items-center ${
                      activeCategory === cat
                        ? 'bg-amber-900 text-white shadow-sm'
                        : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-100'
                    }`}>
                    {cat === 'All' ? t.allCategories : cat}
                  </button>
                ))}
              </div>
            </div>

            {/* Product Grid */}
            {filteredProducts.length === 0 ? (
              <div class="text-center py-20 bg-white rounded-2xl border border-stone-200 p-8">
                <div class="w-16 h-16 mx-auto rounded-full bg-stone-100 flex items-center justify-center text-stone-400 mb-4">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" stroke-width="2"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2"></line>
                  </svg>
                </div>
                <h3 class="font-serif text-lg font-semibold text-stone-800">No apparel found matching your search</h3>
                <p class="text-xs text-stone-500 mt-1 max-w-sm mx-auto">Try clearing your filters or searching for terms like "linen", "shirt", "tunic", or "pants".</p>
                <button
                  onClick={() => { setActiveCategory('All'); setSearchQuery(''); }}
                  class="mt-4 px-5 py-2.5 rounded-full bg-stone-900 text-white text-xs font-semibold uppercase tracking-wider min-touch">
                  Clear All Filters
                </button>
              </div>
            ) : (
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 sm:gap-8">
                {filteredProducts.map(product => {
                  const { sizes, colours } = resolveVariants(product);
                  const sel = getSelection(product.id);
                  const activeColor = sel.colour || colours[0];
                  const activeSize = sel.size || '';

                  return (
                    <div 
                      key={product.id}
                      class="bg-white rounded-2xl border border-stone-200/80 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col group">
                      
                      {/* Product Image Frame */}
                      <div class="relative aspect-[3/4] bg-stone-100 overflow-hidden">
                        <img 
                          src={product.image} 
                          alt={product.name}
                          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div class="absolute top-3 left-3 flex flex-col gap-1.5">

                            {product.category}
                          </span>
                          {product.stock <= 5 && (
                            <span class="px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-bold">
                              {t.lowStock}
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Product Content Body */}
                      <div class="p-5 flex flex-col flex-grow justify-between space-y-4">
                        
                        <div>
                          <div class="flex items-baseline justify-between gap-2">
                            <h3 class="font-serif text-base font-semibold text-stone-900 group-hover:text-amber-800 transition-colors line-clamp-1">
                              {product.name}
                            </h3>
                          </div>
                          <p class="font-serif text-base font-bold text-amber-900 mt-1">
                            {formatLKR(product.price)}
                          </p>
                          <p class="text-xs text-stone-500 mt-1 line-clamp-2 leading-relaxed">
                            {product.description}
                          </p>
                        </div>

                        {/* Interactive Colour Swatch Dots */}
                        <div class="space-y-1.5 pt-1 border-t border-stone-100">
                          <div class="text-[11px] text-stone-500 flex items-center justify-between">
                            <span>{t.colorLabel}: <strong class="text-stone-800">{activeColor.name}</strong></span>
                          </div>
                          <div class="flex items-center gap-2 pt-0.5">
                            {colours.map((c, idx) => {
                              const isSelected = activeColor.name === c.name;
                              return (
                                <button
                                  key={idx}
                                  type="button"
                                  onClick={() => setCardColor(product.id, c)}
                                  title={c.name}
                                  class={`w-6 h-6 rounded-full border border-stone-300 relative transition-transform flex items-center justify-center ${
                                    isSelected ? 'ring-2 ring-offset-1 ring-amber-800 scale-110' : 'hover:scale-105'
                                  }`}
                                  style={{ backgroundColor: c.hex }}>
                                  {isSelected && (
                                    <span class={`w-1.5 h-1.5 rounded-full ${c.hex.toLowerCase() === '#ffffff' || c.hex.toLowerCase() === '#f8f9fa' ? 'bg-stone-900' : 'bg-white'}`}></span>
                                  )}
                                </button>

          {/* ORDER SUCCESS MODAL */}
          {orderSuccessData && (
            <div class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 text-center space-y-5 shadow-2xl border border-stone-200">
                
                <div class="w-16 h-16 mx-auto rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-600">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                </div>

                <div class="space-y-1">
                  <h3 class="font-serif text-2xl font-bold text-stone-900">{t.orderSuccessTitle}</h3>
                  <p class="text-xs text-stone-600">{t.orderSuccessSubtitle}</p>
                </div>

                <div class="bg-stone-50 border border-stone-200 p-4 rounded-xl text-left space-y-2 text-xs">
                  <p class="text-[11px] text-stone-500">{t.keepTokenSafe}</p>
                  <div class="flex justify-between items-center py-1 border-b border-stone-200">
                    <span class="font-semibold text-stone-600">{t.orderId}:</span>
                    <span class="font-mono font-bold text-stone-900 bg-white px-2 py-0.5 rounded border">{orderSuccessData.orderId}</span>
                  </div>
                  <div class="flex justify-between items-center py-1">
                    <span class="font-semibold text-stone-600">{t.accessToken}:</span>
                    <span class="font-mono font-bold text-amber-800 bg-white px-2 py-0.5 rounded border">{orderSuccessData.accessToken}</span>
                  </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                  <button
                    onClick={() => {
                      setTrackInputId(orderSuccessData.orderId);
                      setTrackInputToken(orderSuccessData.accessToken);
                      setTrackedOrder(orderSuccessData);
                      setOrderSuccessData(null);
                      setIsTrackingOpen(true);
                    }}
                    class="flex-1 inline-flex items-center justify-center px-4 py-3 rounded-xl bg-stone-900 text-white text-xs font-semibold tracking-wider uppercase min-touch">
                    {t.trackNow}
                  </button>
                  <button
                    onClick={() => setOrderSuccessData(null)}
                    class="px-5 py-3 rounded-xl border border-stone-300 text-stone-700 text-xs font-medium hover:bg-stone-50 min-touch">
                    {t.close}
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* LIVE ORDER TRACKING MODAL */}
          {isTrackingOpen && (
            <div class="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl border border-stone-200">
                
                <div class="p-5 border-b border-stone-200 flex items-center justify-between">
                  <div>
                    <h3 class="font-serif text-lg font-semibold text-stone-900">Live Parcel Tracking</h3>
                    <p class="text-xs text-stone-500">Track your Colombo Atelier tailoring &amp; courier dispatch</p>
                  </div>
                  <button 
                    onClick={() => setIsTrackingOpen(false)}
                    class="p-2 text-stone-400 hover:text-stone-700 rounded-full min-touch flex items-center justify-center">
                    ✕
                  </button>
                </div>

                <div class="p-6 space-y-6">
                  <form onSubmit={handleTrackLookup} class="space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block text-[11px] font-semibold text-stone-600 mb-1">Order ID</label>
                        <input
                          type="text"
                          required
                          value={trackInputId}
                          onChange={(e) => setTrackInputId(e.target.value)}
                          placeholder="ORD-XXXX"
                          class="w-full p-2.5 rounded-xl border border-stone-300 text-xs font-mono uppercase focus:ring-2 focus:ring-amber-800/20 min-touch"
                        />
                      </div>
                      <div>
                        <label class="block text-[11px] font-semibold text-stone-600 mb-1">Access Token</label>
                        <input
                          type="text"
                          required
                          value={trackInputToken}
                          onChange={(e) => setTrackInputToken(e.target.value)}
                          placeholder="AT-XXXX"
                          class="w-full p-2.5 rounded-xl border border-stone-300 text-xs font-mono uppercase focus:ring-2 focus:ring-amber-800/20 min-touch"
                        />
                      </div>
                    </div>
                    <button
                      type="submit"
                      class="w-full inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-stone-900 text-white text-xs font-semibold tracking-wider uppercase hover:bg-black transition min-touch">
                      Verify &amp; Locate Parcel
                    </button>
                  </form>

                  {trackError && (
                    <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs">
                      {trackError}
                    </div>
                  )}

                  {trackedOrder && (
                    <div class="space-y-6 pt-2 border-t border-stone-100">
                      
                      <div class="bg-stone-50 p-4 rounded-xl border border-stone-200 text-xs flex justify-between items-center">
                        <div>
                          <p class="font-bold text-stone-900">{trackedOrder.orderId}</p>
                          <p class="text-stone-500 mt-0.5">Courier: {trackedOrder.courier || 'Pronto Logistics'}</p>
                          {trackedOrder.trackingNumber && (
                            <p class="text-stone-500 font-mono text-[11px]">Waybill: {trackedOrder.trackingNumber}</p>
                          )}
                        </div>
                        <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 text-[10px] font-bold uppercase tracking-wider">
                          Status: {trackedOrder.status}
                        </span>
                      </div>

                      <div class="py-2">
                        <div class="relative flex items-center justify-between">
                          <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 bg-stone-200 w-full z-0"></div>
                          <div 
                            class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 bg-amber-800 z-0 transition-all duration-500"
                            style={{ width: `${(getStepIndex(trackedOrder.status) / 4) * 100}%` }}></div>
                          
                          {trackingSteps.map((step, idx) => {
                            const isCurrent = getStepIndex(trackedOrder.status) === idx;
                            const isPassed = getStepIndex(trackedOrder.status) >= idx;

                            return (
                              <div key={step.key} class="relative z-10 flex flex-col items-center">
                                <div class={`w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold transition-all ${
                                  isPassed ? 'bg-amber-800 text-white shadow-sm ring-2 ring-amber-800/30' : 'bg-stone-200 text-stone-500'
                                }`}>
                                  {idx + 1}
                                </div>
                                <span class={`text-[10px] mt-2 font-semibold text-center whitespace-nowrap ${
                                  isCurrent ? 'text-amber-900 font-bold' : isPassed ? 'text-stone-800' : 'text-stone-400'
                                }`}>
                                  {step.label}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div class="border-t border-stone-100 pt-3 space-y-2">
                        <h4 class="text-xs font-semibold text-stone-700">Order Items:</h4>
                        {trackedOrder.items && trackedOrder.items.map((it, i) => (
                          <div key={i} class="flex justify-between text-xs text-stone-600">
                            <span>{it.name} ({it.size} / {it.colour ? it.colour.name : ''}) × {it.quantity}</span>
                            <span class="font-serif font-semibold">{formatLKR(it.price * it.quantity)}</span>
                          </div>
                        ))}
                        <div class="flex justify-between text-xs font-bold text-stone-900 pt-2 border-t border-stone-200">
                          <span>Grand Total</span>
                          <span class="font-serif text-amber-900">{formatLKR(trackedOrder.total)}</span>
                        </div>
                      </div>

                    </div>
                  )}

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StorefrontApp />);
  </script>
</body>
</html>
