<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Araliya (Frangipani / Temple Tree Flower) stylized motif -->
  <g transform="translate(15, 12)">
    <circle cx="28" cy="28" r="26" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <!-- 5 Petals of the Araliya flower -->
    <path d="M28 28 C28 14 36 8 40 12 C44 16 38 24 28 28 Z" fill="#d97706" fill-opacity="0.2" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 28 C38 20 46 22 47 28 C48 34 38 36 28 28 Z" fill="#d97706" fill-opacity="0.3" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 28 C34 36 32 46 26 47 C20 48 20 38 28 28 Z" fill="#d97706" fill-opacity="0.2" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 28 C20 34 10 32 9 26 C8 20 18 20 28 28 Z" fill="#d97706" fill-opacity="0.3" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 28 C20 20 18 10 24 9 C30 8 32 18 28 28 Z" fill="#d97706" fill-opacity="0.25" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Flower core -->
    <circle cx="28" cy="28" r="4.5" fill="#f59e0b"/>
    <circle cx="28" cy="28" r="2" fill="#78350f"/>
  </g>

  <!-- Brand Typography -->
  <text x="86" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="600" letter-spacing="4" fill="#1c1917">ARALIYA</text>
  <text x="88" y="54" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="5" fill="#b45309">ATELIER • CEYLON</text>
  <text x="88" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="400" letter-spacing="2" fill="#78716c">ISLAND LINEN &amp; SILKS</text>
</svg>
