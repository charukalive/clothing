<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Mandara stylized celestial floral motif -->
  <g transform="translate(16, 12)">
    <circle cx="28" cy="28" r="26" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <!-- Mandara 8-point geometric floral petals -->
    <path d="M28 6 C32 18 38 24 50 28 C38 32 32 38 28 50 C24 38 18 32 6 28 C18 24 24 18 28 6 Z" fill="#d97706" fill-opacity="0.25" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 14 C36 22 42 28 42 28 C42 28 36 34 28 42 C20 34 14 28 14 28 C14 28 20 22 28 14 Z" fill="#b45309" fill-opacity="0.35" stroke="#92400e" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Core -->
    <circle cx="28" cy="28" r="4" fill="#f59e0b"/>
    <circle cx="28" cy="28" r="1.8" fill="#78350f"/>
  </g>

  <!-- Brand Typography -->
  <text x="88" y="38" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="4.5" fill="#1c1917">MANDARA</text>
  <text x="90" y="54" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="6" fill="#b45309">FASHION • CEYLON</text>
  <text x="90" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="400" letter-spacing="2" fill="#78716c">ISLAND LIVING &amp; APPAREL</text>
</svg>
